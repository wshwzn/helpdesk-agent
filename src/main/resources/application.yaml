spring:
  application:
    name: helpdesk-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: helpdesk-agent
    secret: ${JWT_SECRET}
    access-token-ttl: 2h
  model-config:
    encryption-key: ${MODEL_CONFIG_ENCRYPTION_KEY}
