spring:
  application:
    name: helpdesk-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    issuer: helpdesk-agent
    secret: ${JWT_SECRET}
    access-token-ttl: 240h
  model-config:
    encryption-key: ${MODEL_CONFIG_ENCRYPTION_KEY}
  knowledge:
    index-tasks:
      enabled: ${KNOWLEDGE_INDEX_TASKS_ENABLED:true}
      max-attempts: ${KNOWLEDGE_INDEX_MAX_ATTEMPTS:3}
      lease-seconds: ${KNOWLEDGE_INDEX_LEASE_SECONDS:120}
      retry-delay-seconds: ${KNOWLEDGE_INDEX_RETRY_DELAY_SECONDS:30}
  chat:
    history-limit: ${CHAT_HISTORY_LIMIT:20}
    stream-timeout: ${APP_CHAT_STREAM_TIMEOUT:5m}
    pending-timeout: ${CHAT_PENDING_TIMEOUT:10m}
    pending-recovery-interval: ${CHAT_PENDING_RECOVERY_INTERVAL:1m}
