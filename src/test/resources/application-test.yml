spring:
  datasource:
    url: jdbc:h2:mem:helpdesk;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: helpdesk-agent-test
    secret: test-jwt-secret-with-at-least-thirty-two-characters
    access-token-ttl: 30m
  model-config:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  storage:
    provider: local
    local-root-directory: ./target/test-object-storage
  knowledge:
    processing:
      max-extracted-characters: 2000000
      chunk-size: 1000
      chunk-overlap: 150
